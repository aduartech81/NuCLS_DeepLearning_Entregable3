<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="#faf8f5"/><text x="30" y="35" font-family="sans-serif" font-size="22">Proceso de desarrollo E3</text><rect x="30" y="65" width="260" height="65" rx="12" fill="#087f8c"/><text x="45" y="102" font-size="18" fill="white" font-family="sans-serif">1. Campos y anotaciones</text><text x="295" y="105" font-size="22">→</text><rect x="320" y="65" width="260" height="65" rx="12" fill="#087f8c"/><text x="335" y="102" font-size="18" fill="white" font-family="sans-serif">2. Separar por paciente</text><text x="585" y="105" font-size="22">→</text><rect x="610" y="65" width="260" height="65" rx="12" fill="#087f8c"/><text x="625" y="102" font-size="18" fill="white" font-family="sans-serif">3. Recortes + manifiesto</text><rect x="30" y="175" width="260" height="65" rx="12" fill="#087f8c"/><text x="45" y="212" font-size="18" fill="white" font-family="sans-serif">4. Entrenar en train</text><text x="295" y="215" font-size="22">→</text><rect x="320" y="175" width="260" height="65" rx="12" fill="#087f8c"/><text x="335" y="212" font-size="18" fill="white" font-family="sans-serif">5. Elegir en validación</text><text x="585" y="215" font-size="22">→</text><rect x="610" y="175" width="260" height="65" rx="12" fill="#087f8c"/><text x="625" y="212" font-size="18" fill="white" font-family="sans-serif">6. Verificar ONNX / CPU</text><text x="30" y="290" font-family="sans-serif" font-size="16">La prueba confirmatoria independiente sigue pendiente.</text></svg>